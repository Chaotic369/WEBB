name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true
      - name: Set Custom App ID, Namespace, and Name
        run: |
          sed -i 's/applicationId.*/applicationId = \"com.custom.webwallpaper808720\"/g' app/build.gradle.kts || true
          sed -i 's/applicationId .*/applicationId \"com.custom.webwallpaper808720\"/g' app/build.gradle || true
          sed -i 's/namespace.*/namespace = \"com.custom.webwallpaper808720\"/g' app/build.gradle.kts || true
          sed -i 's/namespace .*/namespace \"com.custom.webwallpaper808720\"/g' app/build.gradle || true
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">WALP<\/string>/g' app/src/main/res/values/strings.xml || true
      - name: Sanitize and Apply Custom Icon
        run: |
          sed -i '1!{/^[[:space:]]*$/d}' app/src/main/AndroidManifest.xml || true
          sed -i '1s/^[[:space:]]*//' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/<application/<application android:icon="@drawable\/ic_launcher"/g' app/src/main/AndroidManifest.xml || true
      - name: Debug - Print Manifest
        run: cat app/src/main/AndroidManifest.xml
      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebWallpaper-APK
          path: app/build/outputs/apk/debug/app-debug.apk